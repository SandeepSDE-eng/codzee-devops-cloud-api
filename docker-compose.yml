version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codzee-cloud-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
